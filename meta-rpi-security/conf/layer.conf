# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rpi-security"
BBFILE_PATTERN_meta-rpi-security = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rpi-security = "6"

LAYERDEPENDS_meta-rpi-security = "core"
LAYERSERIES_COMPAT_meta-rpi-security = "scarthgap"
